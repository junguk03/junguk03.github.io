<article class="card">
  <div class="card-head">
    <span class="card-icon" aria-hidden="true">{{ .icon }}</span>
    <div>
      <h3>{{ .name }}</h3>
      <p class="meta">{{ with .role }}{{ . }}{{ end }}{{ with .period }} · {{ . }}{{ end }}</p>
    </div>
  </div>
  <p>{{ .desc }}</p>
  {{ with .stack }}<ul class="chips">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}
  {{ with .links }}<p class="card-links">{{ range . }}<a href="{{ .url }}">{{ .label }} →</a>{{ end }}</p>{{ end }}
</article>
