{{ define "main" }}
<header class="page-head">
  <p class="cmd"><span class="prompt">$</span> ls ./{{ .Data.Plural }}</p>
  <h1>{{ .Title }}</h1>
</header>
<ul class="post-list">
  {{ range .Data.Terms.Alphabetical }}
  <li><a href="{{ .Page.RelPermalink }}">#{{ .Page.Title }}</a> <span class="muted">({{ .Count }})</span></li>
  {{ else }}
  <li class="muted">아직 없어요.</li>
  {{ end }}
</ul>
{{ end }}
