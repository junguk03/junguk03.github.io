{{ define "main" }}
<header class="page-head">
  <p class="cmd"><span class="prompt">$</span> grep -r "#{{ .Title }}"</p>
  <h1>#{{ .Title }}</h1>
</header>
<ul class="post-list">
  {{ range .Pages.ByDate.Reverse }}
  <li><time>{{ .Date.Format "2006.01.02" }}</time> <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{ end }}
</ul>
{{ end }}
