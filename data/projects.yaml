# 워게임 익스플로잇 코드 (test_exploit_code 저장소)
exploits:
  repo: "https://github.com/junguk03/test_exploit_code"
  desc: "Dreamhack 워게임과 PortSwigger 랩을 풀면서 직접 작성한 Python 익스플로잇 코드입니다."
  items:
    - { type: "NoSQL Injection", what: "MongoDB $regex로 FLAG 한 글자씩 추출, CouchDB _all_docs 조회, 객체 주입 인증 우회" }
    - { type: "SQL Injection", what: "Blind SQLi(substr)로 admin 비밀번호 추출 자동화" }
    - { type: "SSRF", what: "10진수 IP 표기(2130706433)로 필터 우회 후 내부 포트 브루트포스" }
    - { type: "Command Injection", what: "쿠키 값에 $(...) 삽입 → 결과를 외부 서버로 전송" }
    - { type: "Path Traversal → RCE", what: "tomcat-users.xml 유출로 계정 획득 → Manager로 WAR 웹셸 배포" }
    - { type: "Crypto", what: "AES-CBC Padding Oracle Attack으로 키 없이 암호문 복호화" }
    - { type: "로직 버그 / 접근제어", what: "대소문자 비교 미흡을 이용한 비밀번호 변경, Referer·헤더 조작 + 문서 ID 브루트포스" }
    - { type: "Authentication (PortSwigger)", what: "X-Forwarded-For로 IP 차단 우회, 에러 메시지·응답 시간 차이로 사용자명 열거" }

