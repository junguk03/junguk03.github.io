    role: "팀장 · 4인 팀"
    period: "2026.10 ~"
    desc: "보안 동아리 4명이 Flask로 원서 접수 서비스를 직접 만들고, 2명씩 두 조로 나눠 취약점을 심은 문제를 출제한 뒤 상대 조와 바꿔 푸는 CTF 구축 프로젝트. 소스는 공개하고 플래그만 비공개로 두는 화이트박스 방식으로, 공통 서비스 틀·디자인·깃 관리를 맡았습니다."
