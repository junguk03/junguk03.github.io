    links:
      - { label: "GitHub", url: "https://github.com/junguk03/Write_Up_GlassHouse" }
  - name: "Clash Royale 전적 검색"
    icon: "🎮"
    role: "개인"
    desc: "Supercell API를 활용한 플레이어 통계 조회 서비스. Flutter Web + Node.js Express 백엔드로 구성되어 있으며, 현재 로컬 환경에서 보안 취약점 분석 학습용으로 활용 중입니다."
    stack: ["Node.js", "Express", "Flutter", "AWS EC2"]
    links:
      - { label: "GitHub", url: "https://github.com/junguk03/ClashRoyalProject" }
  - name: "Chatvas"
    icon: "🤖"
    role: "개인"
    desc: "AI와 대화하며 UI를 디자인하고 코드로 변환하는 오픈소스 도구. Claude API를 활용한 대화형 디자인 솔루션으로, 현재 로컬에서 취약점 분석 학습용으로 활용 중입니다."
    stack: ["Next.js", "TypeScript", "Claude API", "Tailwind"]
    links:
      - { label: "GitHub", url: "https://github.com/junguk03/Chatvas" }

